# XcodeGen spec for the Following app. GitHub Actions runs `xcodegen generate` to make
# Following.xcodeproj (not committed), then builds an unsigned .ipa for SideStore / AltStore.
name: Following
options:
  bundleIdPrefix: com.arjankahlon
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Following:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
        buildPhase: resources
      # The NoScroll engine, used as-is from upstream so engine fixes flow in on merge.
      - path: ../ios/NoScroll/Resources/noscroll.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arjankahlon.following
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Following
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Always light, like the app's own feed design, even when the phone is in dark mode.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Picture in Picture keeps playing outside the app.
        # Load all stories: iOS may wake the app to send what was watched, liked or replied offline.
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.arjankahlon.following.sync]
        NSCameraUsageDescription: Instagram asks for the camera when you send a photo or video in Messages.
        NSMicrophoneUsageDescription: Instagram asks for the microphone when you record a voice message or video.
        NSPhotoLibraryUsageDescription: Lets you pick photos to send in Messages.
